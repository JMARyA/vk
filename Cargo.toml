[package]
name = "vk"
version = "0.1.0"
edition = "2021"
authors = ["JMARyA <jmarya@hydrar.de>"]

[dependencies]
argh = "0.1.13"
chrono = "0.4.38"
crossterm = "0.27.0"
ratatui = { version = "0.28", default-features = false, features = ["crossterm"] }
dirs = "5.0.1"
html2text = "0.17.0"
moka = { version = "0.12.7", features = ["sync"] }
once_cell = "1.19.0"
reqwest = { version = "0.12.4", features = ["blocking", "json"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9.0"
vikunjars = { git = "https://git.hydrar.de/jmarya/vikunja-rs" }
unicode-width = "0.2.2"
pulldown-cmark = "0.13"
htmd = "0.5"
