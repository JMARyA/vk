[package]
name = "vk"
version = "0.1.0"
edition = "2021"
authors = ["JMARyA <jmarya@hydrar.de>"]

[dependencies]
argh = "0.1.19"
chrono = "0.4.45"
crossterm = "0.29.0"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
dirs = "7.0.0"
html2text = "0.17.1"
moka = { version = "0.12.16", features = ["sync"] }
once_cell = "1.21.4"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
vikunjars = { git = "https://git.hydrar.de/jmarya/vikunja-rs" }
unicode-width = "0.2.2"
pulldown-cmark = "0.13"
htmd = "0.5"
